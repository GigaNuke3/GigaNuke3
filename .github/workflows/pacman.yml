name: Generate Contribution Arcade
on:
  schedule:
    - cron: "31 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pacman.yml"
permissions:
  contents: write
jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Generate arcade SVGs
        uses: abozanona/pacman-contribution-graph@v5.0.0
        with:
          github_user_name: GigaNuke3
          games: "pacman"
          hide_month_labels: "false"
      - name: Publish generated SVGs
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
