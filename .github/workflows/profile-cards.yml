name: Update Profile Graphics
on:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/profile_card.py"
      - ".github/workflows/profile-cards.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-graphics
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        run: |
          git clone --depth 1 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" repo
          cd repo
          git checkout main
      - name: Render SVGs
        working-directory: repo
        run: python3 scripts/profile_card.py
      - name: Commit generated SVGs
        working-directory: repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile_dark.svg profile_light.svg graph_dark.svg graph_light.svg activity_dark.svg activity_light.svg
          if git diff --cached --quiet; then
            echo "No graphics changed."
            exit 0
          fi
          git commit -m "chore: update profile graphics"
          git push origin main
